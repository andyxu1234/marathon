<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>添加赛事</title>
    <style id="theme-vars">
/* Marathon Mini-Program Design Tokens */
/* Brand prefix: brand */

:root {
  --brand: #10B981;
  --brand-foreground: #FFFFFF;
  --brand-light: #ECFDF5;
  --brand-background: #F0FDFA;
  --brand-foreground: #0F172A;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #0F172A;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #0F172A;
  --brand-primary: #10B981;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F1F5F9;
  --brand-muted-foreground: #64748B;
  --brand-border: #E2E8F0;
  --brand-input: #F1F5F9;
  --brand-ring: #10B981;
  --brand-destructive: #EF4444;
  --brand-destructive-foreground: #FFFFFF;
  --state-success: #10B981;
  --state-success-light: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-light: #FEF3C7;
  --state-error: #EF4444;
  --state-error-light: #FEE2E2;
  --state-info: #0EA5E9;
  --state-info-light: #E0F2FE;
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
  --brand-radius-xl: 16px;
  --brand-radius-pill: 999px;
  --brand-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
  --brand-shadow-md: 0 2px 8px -2px rgba(0, 0, 0, 0.04);
  --brand-shadow-lg: 0 8px 24px -6px rgba(0, 0, 0, 0.04);
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

html {
  font-family: var(--brand-font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--brand-font-sans);
  color: var(--brand-foreground);
  background-color: var(--brand-background);
}
    </style>

    <style type="text/tailwindcss">

  }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        display: inline-flex;

        -webkit-mask-size: contain;
        mask-size: contain;

<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        .mobile-root {
          max-width: 420px;
          margin: 0 auto;
          min-height: 100vh;
          background: var(--brand-background);
          position: relative;
        }
        .sticky-top-nav {
          position: sticky;
          top: 0;
          z-index: 50;
          background: var(--brand-card);
          border-bottom: 1px solid var(--brand-border);
          height: 56px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
        }
        .nav-icon-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 32px;
          height: 32px;
          cursor: pointer;
          color: var(--brand-foreground);
          border: none;
          background: transparent;
        }
        .form-section {
          background: var(--brand-card);
          border-radius: var(--brand-radius-lg);
          border: 1px solid var(--brand-border);
          padding: 16px;
          margin: 0 16px 16px;
        }
        .form-row {
          display: flex;
          flex-direction: column;
          gap: 6px;
          padding: 10px 0;
          border-bottom: 1px solid var(--brand-border);
        }
        .form-row:last-child {
          border-bottom: none;
        }
        .form-label {
          font-size: 13px;
          font-weight: 500;
          color: var(--brand-foreground);
        }
        .form-label-required::after {
          content: " *";
          color: var(--brand-primary);
        }
        .form-input {
          width: 100%;
          height: 40px;
          border: 1px solid var(--brand-border);
          border-radius: var(--brand-radius-md);
          font-size: 14px;
          padding: 0 12px;
          background: var(--brand-card);
          color: var(--brand-foreground);
        }
        .form-input::placeholder {
          color: var(--brand-muted-foreground);
        }
        .form-textarea {
          width: 100%;
          min-height: 80px;
          border: 1px solid var(--brand-border);
          border-radius: var(--brand-radius-md);
          font-size: 14px;
          padding: 8px 12px;
          background: var(--brand-card);
          color: var(--brand-foreground);
          resize: vertical;
          font-family: inherit;
        }
        .chip-group {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }
        .chip {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          padding: 6px 14px;
          border-radius: 20px;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          border: 1px solid var(--brand-border);
          background: var(--brand-card);
          color: var(--brand-muted-foreground);
        }
        .chip.active {
          background: var(--brand-light);
          color: var(--brand-primary);
          border-color: var(--brand-primary);
        }
        .sticky-bottom-bar {
          position: sticky;
          bottom: 0;
          z-index: 50;
          background: var(--brand-card);
          padding: 12px 16px;
          border-top: 1px solid var(--brand-border);
        }
        .submit-btn {
          width: 100%;
          height: 48px;
          background: var(--brand-primary);
          color: var(--brand-primary-foreground);
          border: none;
          border-radius: var(--brand-radius-lg);
          font-weight: 600;
          font-size: 15px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          cursor: pointer;
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .submit-btn:hover {
          transform: translateY(-1px);
          box-shadow: var(--brand-shadow-md);
        }
        .section-title {
          font-size: 16px;
          font-weight: 600;
          color: var(--brand-foreground);
          margin: 0 16px 12px;
        }
      </style>
      <div class="mobile-root">
        <!-- Section 1: Top Nav Bar -->
        <nav class="sticky-top-nav">
          <button class="nav-icon-btn" data-dom-id="back-btn:add-race.html" aria-label="返回">
            <i data-lucide="chevron-left" style="width:24px;height:24px;"></i>
          </button>
          <span style="font-size:16px;font-weight:600;color:var(--brand-foreground);">添加赛事</span>
          <span style="width:32px;"></span>
        </nav>

        <!-- Section 2: Form -->
        <div style="padding:16px 0;">

          <!-- Basic Info -->
          <h2 class="section-title">基本信息</h2>
          <div class="form-section">
            <div class="form-row">
              <span class="form-label form-label-required">赛事名称</span>
              <input type="text" class="form-input" placeholder="例如：南京马拉松" />
            </div>
            <div class="form-row">
              <span class="form-label form-label-required">赛事类型</span>
              <div class="chip-group">
                <span class="chip active">全马</span>
                <span class="chip">半马</span>
                <span class="chip">10KM</span>
                <span class="chip">欢乐跑</span>
              </div>
            </div>
            <div class="form-row">
              <span class="form-label form-label-required">比赛日期</span>
              <input type="text" class="form-input" placeholder="例如：2026-11-10" />
            </div>
            <div class="form-row">
              <span class="form-label">比赛地点</span>
              <input type="text" class="form-input" placeholder="例如：南京" />
            </div>
            <div class="form-row">
              <span class="form-label">赛事等级</span>
              <div class="chip-group">
                <span class="chip active">普通</span>
                <span class="chip">铜标</span>
                <span class="chip">银标</span>
                <span class="chip">金标</span>
              </div>
            </div>
          </div>

          <!-- Status Info -->
          <h2 class="section-title">报名状态</h2>
          <div class="form-section">
            <div class="form-row">
              <span class="form-label">报名状态</span>
              <div class="chip-group">
                <span class="chip active">未报名</span>
                <span class="chip">已报名</span>
              </div>
            </div>
            <div class="form-row">
              <span class="form-label">缴费状态</span>
              <div class="chip-group">
                <span class="chip active">未缴费</span>
                <span class="chip">已缴费</span>
              </div>
            </div>
            <div class="form-row">
              <span class="form-label">中签状态</span>
              <div class="chip-group">
                <span class="chip active">未中签</span>
                <span class="chip">已中签</span>
                <span class="chip">抽签中</span>
              </div>
            </div>
            <div class="form-row">
              <span class="form-label">报名费用</span>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:14px;color:var(--brand-muted-foreground);">¥</span>
                <input type="text" class="form-input" style="width:120px;" placeholder="0" />
              </div>
            </div>
          </div>

        </div>

        <!-- Section 3: Submit Button -->
        <div class="sticky-bottom-bar">
          <button class="submit-btn" data-dom-id="submit-btn:add-race.html">
            <i data-lucide="check" style="width:18px;height:18px;"></i>
            <span>保存并添加到关注</span>
          </button>
        </div>

        <!-- Section 4: Bottom Navigation -->
        <nav data-mobile-nav="global" class="w-full h-[64px] border-t border-[var(--brand-border)] bg-[var(--brand-card)]">
          <div class="w-full grid grid-cols-3 h-full">
            <a data-nav-key="home" data-dom-id="nav-home:add-race.html" class="flex flex-col items-center justify-center gap-1 px-1 h-full text-[var(--brand-muted-foreground)]">
              <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
              <span class="text-[11px] leading-none whitespace-nowrap">首页</span>
            </a>
            <a data-nav-key="follow" data-active="true" data-dom-id="nav-follow:add-race.html" class="flex flex-col items-center justify-center gap-1 px-1 h-full text-[var(--brand-primary)] font-semibold">
              <i data-lucide="heart" class="w-5 h-5 shrink-0"></i>
              <span class="text-[11px] leading-none whitespace-nowrap">关注</span>
            </a>
            <a data-nav-key="mine" data-dom-id="nav-mine:add-race.html" class="flex flex-col items-center justify-center gap-1 px-1 h-full text-[var(--brand-muted-foreground)]">
              <i data-lucide="user" class="w-5 h-5 shrink-0"></i>
              <span class="text-[11px] leading-none whitespace-nowrap">我的</span>
            </a>
          </div>
        </nav>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
